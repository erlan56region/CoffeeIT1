<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Червяк Джим — Космическое спасение (2D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="touch">
      <div class="pad left">
        <button data-key="left">◀</button>
        <button data-key="right">▶</button>
      </div>
      <div class="pad right">
        <button data-key="whip" class="small">ХЛЫСТ</button>
        <button data-key="shoot" class="small">ОГОНЬ</button>
        <button data-key="jump">⤒</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
